# CI workflow
on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # Pinned to 22.04: newer images ship a glibc our prebuilt sqlite extension can't load.
    container: ubuntu:22.04
    steps:
      - uses: actions/checkout@v4
      # - uses: actions/cache@v4
      - uses: dtolnay/rust-toolchain@stable
      # Run tests
      - run: cargo test
