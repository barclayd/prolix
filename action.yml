name: prolix
description: Flags comments in a pull request that don't earn their place, judged by Jev, and suggests removing them
author: barclayd
branding:
  icon: message-square
  color: yellow

inputs:
  api-key:
    description: Typesafe API key for Jev, from a secret. When it's empty, as on pull requests from forks, the check is skipped.
    required: false
  mode:
    description: off, standard or strict. Defaults to prolix.jsonc, then standard.
    default: ""
  level:
    description: The old name for `mode`.
    deprecationMessage: Use `mode` instead of `level`.
    default: ""
  scope:
    description: On pull requests, `changed` checks only comments on lines the pull request adds and `full` checks the whole repository. Other events always check the whole repository.
    default: changed
  comment:
    description: Post a summary comment when comments are flagged, and keep it up to date on later runs.
    default: "true"
  suggestions:
    description: Post validated fixes as one-click review suggestions and resolve obsolete Prolix threads on reruns. Needs scope `changed` and the pull request's head checked out with full history.
    default: "true"
  fail-on-findings:
    description: Fail the job when comments are flagged.
    default: "false"
  version:
    description: The @prolix/cli version to run. Set the PROLIX_BINARY environment variable to run a local build instead.
    default: latest

outputs:
  flagged:
    description: How many comments were flagged.
    value: ${{ steps.prolix.outputs.flagged }}

runs:
  using: composite
  steps:
    - id: prolix
      shell: bash
      env:
        TYPESAFE_API_KEY: ${{ inputs.api-key }}
        GH_TOKEN: ${{ github.token }}
        INPUT_MODE: ${{ inputs.mode || inputs.level }}
        INPUT_SCOPE: ${{ inputs.scope }}
        INPUT_COMMENT: ${{ inputs.comment }}
        INPUT_SUGGESTIONS: ${{ inputs.suggestions }}
        INPUT_FAIL: ${{ inputs.fail-on-findings }}
        INPUT_VERSION: ${{ inputs.version }}
        PR: ${{ github.event.pull_request.number }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        PR_AUTHOR: ${{ github.event.pull_request.user.login }}
      run: |
        set -eo pipefail
        if [ -n "$PROLIX_BINARY" ]; then
          exec "$PROLIX_BINARY" github action --action-protocol=1
        fi
        exec npx --yes "@prolix/cli@$INPUT_VERSION" github action --action-protocol=1
