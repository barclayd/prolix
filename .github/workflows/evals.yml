name: evals

on:
  pull_request:
    paths: ["src/**", "tests/evals/**", "Cargo.*", ".github/workflows/evals.yml"]
  workflow_dispatch:
    inputs:
      repeat:
        description: Times each fixture is judged (1-5)
        default: "3"

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release --test evals -- --ignored --nocapture
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          EVAL_REPEAT: ${{ inputs.repeat || '3' }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: tests/evals/results
          if-no-files-found: ignore
