name: prolix

on: pull_request

permissions:
  contents: read
  pull-requests: write

jobs:
  prolix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      # Runs this checkout's action with this checkout's build, so both are tested before release.
      - uses: ./
        env:
          PROLIX_BINARY: ${{ github.workspace }}/target/release/prolix
        with:
          api-key: ${{ secrets.TYPESAFE_API_KEY }}
