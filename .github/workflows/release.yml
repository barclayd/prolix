name: release

on:
  push:
    branches: [main]
  # Pull requests publish a canary, which also tests the npm packages before a release.
  pull_request:
    paths: ["src/**", "npm/**", "Cargo.*", ".github/workflows/release.yml"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Keeps a Version PR open while changesets are pending. Merging it leaves npm/cli at a version with no GitHub release,
  # which the jobs below then release. The GitHub release is the last step, so a release that failed partway is retried
  # on the next push to main, and the jobs below skip whatever already reached npm.
  changesets:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # ponytail: `npm ci` rejects the lockfile npm 11 writes, because @manypkg/find-root hoists @types/node 12 under an
      # optional peer that wants 18. Switch back to `npm ci` once npm validates optional peers the way it installs them.
      - run: npm install --no-audit --no-fund
      - id: changesets
        uses: changesets/action@v1
        with:
          version: npm run version-packages
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - id: check
        if: steps.changesets.outputs.hasChangesets == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "v$(jq -r .version npm/cli/package.json)" || echo release=true >> "$GITHUB_OUTPUT"

  build:
    needs: changesets
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || needs.changesets.outputs.release == 'true') }}
    strategy:
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest, npm: darwin-arm64 }
          - { target: x86_64-apple-darwin, os: macos-latest, npm: darwin-x64 }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, npm: linux-x64 }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, npm: linux-arm64 }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, npm: win32-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo test
        if: "!contains(matrix.target, 'x86_64-apple')"
      - run: cargo build --release --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.npm }}
          path: target/${{ matrix.target }}/release/prolix${{ contains(matrix.target, 'windows') && '.exe' || '' }}

  # Publishes with npm trusted publishing: npm trades the job's OIDC token for a short-lived one, so there's no npm secret.
  # Pull requests from forks get no OIDC token, so they only build. The Version PR only bumps the version, so it skips the
  # canary too.
  publish:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' && (github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.head_ref != 'changeset-release/main')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    env:
      NPM_CONFIG_PROVENANCE: true
    steps:
      - uses: actions/checkout@v4
      # Trusted publishing needs npm 11.5.1 or later.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Pick the version
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          version=$(jq -r .version npm/cli/package.json)
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            # A hyphen, not a dot: a dotted all-digit sha with a leading zero isn't valid semver.
            version="$version-canary-${HEAD_SHA::7}"
            tag=canary
          else
            tag=latest
            [[ $version != *-* ]] || tag=next
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=$tag" >> "$GITHUB_ENV"
      # Each publish skips a version npm already has, so a re-run picks up where a failed run stopped.
      - name: Publish platform packages
        run: |
          for dir in dist/*; do
            npm=$(basename "$dir")
            os=${npm%-*}
            cpu=${npm#*-}
            exe=$(ls "$dir")
            chmod +x "$dir/$exe"
            printf '{"name":"@prolix/cli-%s","version":"%s","os":["%s"],"cpu":["%s"],"files":["%s"],"repository":{"type":"git","url":"git+%s.git"}}\n' \
              "$npm" "$VERSION" "$os" "$cpu" "$exe" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" > "$dir/package.json"
            npm view "@prolix/cli-$npm@$VERSION" version || (cd "$dir" && npm publish --access public --tag "$TAG")
          done
      - name: Publish @prolix/cli
        working-directory: npm/cli
        run: |
          node -e '
            const fs = require("fs"), v = process.argv[1], p = JSON.parse(fs.readFileSync("package.json"));
            p.version = v;
            p.optionalDependencies = Object.fromEntries(fs.readdirSync("../../dist").map((d) => [`@prolix/cli-${d}`, v]));
            fs.writeFileSync("package.json", JSON.stringify(p, null, 2) + "\n");
          ' "$VERSION"
          cp ../../README.md .
          npm view "@prolix/cli@$VERSION" version || npm publish --access public --tag "$TAG"
      # Installs what was just published. New versions can take 20 minutes or more to show up on the registry.
      # Each try gets a fresh cache: npx would otherwise keep reusing an install made before a platform package showed up.
      # It runs outside the checkout, where npx would find the uninstalled npm/cli workspace instead.
      - name: Check the package runs
        working-directory: ${{ runner.temp }}
        run: |
          for i in $(seq 120); do
            npm_config_cache=$(mktemp -d) npx --yes "@prolix/cli@$VERSION" --version && exit 0
            sleep 20
          done
          exit 1
      - name: Comment on the pull request
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: canary
          message: |
            ### 📦 Canary

            ```sh
            npx @prolix/cli@${{ env.VERSION }}
            ```

            In the action, set `version: ${{ env.VERSION }}`. Built from ${{ github.event.pull_request.head.sha }}.
      # Tags the release with its changelog, and moves the major tag (v0, v1, ...) so workflows can use
      # barclayd/prolix@v0. Prereleases leave the major tag alone.
      - name: Release on GitHub
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v v="## $VERSION" '$0 == v {on=1; next} /^## / {on=0} on' npm/cli/CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ "$TAG" = latest ]; then
            gh release create "v$VERSION" --target "$GITHUB_SHA" --notes-file "$RUNNER_TEMP/notes.md"
            git tag -f "v${VERSION%%.*}" "$GITHUB_SHA"
            git push -f origin "v${VERSION%%.*}"
          else
            gh release create "v$VERSION" --target "$GITHUB_SHA" --notes-file "$RUNNER_TEMP/notes.md" --prerelease
          fi
