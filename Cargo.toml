[package]
name = "prolix"
version = "0.4.0"
edition = "2021"
description = "Ultrafast linter that removes comments that don't add value, powered by Jev"

[dependencies]
base64 = "0.22"
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tree-sitter = "0.27"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
ureq = { version = "2", features = ["json"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"
